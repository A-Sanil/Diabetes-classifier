<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diabetes Classifier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .container { max-width: 600px; margin-top: 40px; }
    .card { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .form-label { font-weight: 500; }
    .result-table td, .result-table th { padding: 0.5rem 1rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="card p-4">
    <h2 class="mb-4 text-center">Diabetes Prediction</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">User ID (optional)</label>
        <input type="text" class="form-control" name="user_id" placeholder="Enter user ID">
      </div>
      {% for feature in feature_names %}
      <div class="mb-3">
        <label class="form-label">{{ feature.replace('_', ' ').title() }}</label>
        <input type="number" step="any" class="form-control" name="{{ feature }}" required>
      </div>
      {% endfor %}
      <div class="mb-3">
        <label class="form-label">Smoking History</label>
        <select class="form-select" name="smoking_history" required>
          <option value="never">never</option>
          <option value="No Info">No Info</option>
          <option value="current">current</option>
          <option value="former">former</option>
          <option value="not current">not current</option>
          <option value="ever">ever</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Gender</label>
        <select class="form-select" name="gender" required>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Predict</button>
    </form>
    {% if result %}
    <hr>
    <h4 class="mt-4">Prediction Results{% if user_id %} for User: <span class="text-info">{{ user_id }}</span>{% endif %}</h4>
    <table class="table table-bordered result-table mt-3">
      <thead class="table-light"><tr><th>Model</th><th>Prediction</th></tr></thead>
      <tbody>
        {% for k, v in result.items() %}
        <tr><td>{{ k }}</td><td>{{ v }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    {% endif %}
  </div>
</div>
</body>
</html>
